# Piloto CRM Jarinox -> Frappe en Docker (127.0.0.1:8000).
# Creado fuera de CloudPanel (ver D-008): si el panel regenera vhosts,
# este archivo puede perderse y hay que volver a crearlo.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /opt/crm-jarinox/web/letsencrypt/live/crm.jarinox.com/fullchain.pem;
  ssl_certificate_key /opt/crm-jarinox/web/letsencrypt/live/crm.jarinox.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  server_name crm.jarinox.com;
  root /opt/crm-jarinox/web/htdocs;

  access_log /opt/crm-jarinox/web/logs/access.log main;
  error_log /opt/crm-jarinox/web/logs/error.log;

  # Imprescindible para que certbot valide el dominio.
  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  # Redirige todo el trafico a HTTPS, salvo la validacion de certbot.
  if ($scheme != "https") {
    rewrite ^ https://$host$uri permanent;
  }

  client_max_body_size 50m;

  location / {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Frappe identifica el sitio por esta cabecera.
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_connect_timeout 120;
    proxy_send_timeout 120;
    proxy_read_timeout 120;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # Websocket de Frappe (tiempo real).
  location /socket.io/ {
    proxy_pass http://127.0.0.1:8000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
  }
}
